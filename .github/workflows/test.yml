name: Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux-stable, macos-stable, windows-stable]
        include:
          - build: linux-stable
            os: ubuntu-latest
            rust: stable
          - build: macos-stable
            os: macos-latest
            rust: stable
          - build: windows-stable
            os: windows-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: nanasess/setup-chromedriver@master
      - if: matrix.os == 'macos-latest'
        run: brew install --cask firefox
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v3
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-build-${{ hashFiles('Cargo.lock') }}
      - name: Run Tests
        run: cargo test --all --locked
        env:
          RUST_BACKTRACE: 1
      - name: Clippy
        run: cargo clippy
      - name: Cargo fmt
        run: cargo fmt --all -- --check

  test-emscripten:
    name: Test (emscripten)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@v3
        with:
          node-version: "24"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-emscripten-${{ hashFiles('Cargo.lock') }}
      # No emsdk setup: the runners have no emcc, so this exercises
      # wasm-pack's own Emscripten toolchain auto-install into the test
      # cache (target/test_cache, persisted by the cache step above).
      - name: Run emscripten tests
        shell: bash
        # Single-threaded: parallel fixtures race the shared tool cache
        # (cargo-install fallback renames into the same directory).
        run: "cargo test --test all emscripten:: --locked -- --test-threads=1"
        env:
          RUST_BACKTRACE: 1
          WASM_PACK_TEST_EMSCRIPTEN: "1"
