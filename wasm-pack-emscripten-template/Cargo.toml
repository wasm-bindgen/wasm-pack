[package]
name = "{{project-name}}"
version = "0.1.0"
authors = ["{{authors}}"]
edition = "2021"

[dependencies]
# 0.2.122 is the floor that ships the emscripten output mode and the marker
# section emcc's `-sWASM_BINDGEN` detects; older releases will produce
# broken JS/wasm under the emscripten target.
wasm-bindgen = "0.2.122"

[profile.release]
# Tell `rustc` to optimize for small code size; emcc will further optimize at
# link time via wasm-opt.
opt-level = "s"
